# NTrack on Render (Blueprint). Render: New > Blueprint > this repo.
#
# Creates one Render project "NTrack" (kept apart from other services in the workspace) with:
#   ntrack-api        Express API (console sign-in, campaigns, reports)  -> nextagmedia.com/ntrack/api
#   ntrack-tracker    Fastify tracker (clicks, postbacks, pixel)          -> nextagmedia.com/click
#   ntrack-workers    BullMQ/stream workers (click storage, postbacks, config sync)
#   ntrack-clickhouse ClickHouse for click and conversion events (private, persistent disk)
#   ntrack-db         PostgreSQL 17
#   ntrack-redis      Key Value (Redis-compatible), noeviction so queued jobs are never dropped
#
# Visitors never use the onrender.com addresses: the website (Vercel) forwards /ntrack/api and the
# tracking paths to them. Secrets are generated by Render (generateValue) or asked for on creation
# (sync: false); none are stored in this file.
#
# Plans and region are proposals; confirm cost with the team before applying.

previews:
  generation: off

projects:
  - name: NTrack
    environments:
      - name: production
        envVarGroups:
          - name: ntrack-secrets
            envVars:
              # 32 random bytes, base64 (what the API expects). Back it up: losing it makes saved
              # integration passwords unreadable.
              - key: ENCRYPTION_KEY
                generateValue: true
              - key: TRACKING_HASH_SECRET
                generateValue: true
              # Copy this value into Vercel as TRACKER_PROXY_SECRET.
              - key: TRACKER_PROXY_SECRET
                generateValue: true

          - name: ntrack-common
            envVars:
              - key: NODE_ENV
                value: production
              - key: NODE_VERSION
                value: "22"
              - key: LOG_LEVEL
                value: info
              - key: CONSOLE_ORIGIN
                value: https://nextagmedia.com
              - key: CONSOLE_BASE_PATH
                value: /ntrack
              - key: CLICKHOUSE_DATABASE
                value: ntrack
              - key: CLICKHOUSE_USER
                value: default
              - key: ALLOW_PRIVATE_OUTBOUND
                value: "false"

        databases:
          - name: ntrack-db
            databaseName: ntrack
            user: ntrack
            plan: basic-1gb
            region: singapore
            postgresMajorVersion: "17"
            ipAllowList: []

        services:
          - type: keyvalue
            name: ntrack-redis
            plan: starter
            region: singapore
            maxmemoryPolicy: noeviction
            ipAllowList: []

          - type: pserv
            name: ntrack-clickhouse
            runtime: image
            image:
              url: docker.io/clickhouse/clickhouse-server:25.8
            plan: standard
            region: singapore
            disk:
              name: clickhouse-data
              mountPath: /var/lib/clickhouse
              sizeGB: 20
            envVars:
              - key: CLICKHOUSE_USER
                value: default
              - key: CLICKHOUSE_PASSWORD
                generateValue: true
              - key: CLICKHOUSE_DB
                value: ntrack

          - type: web
            name: ntrack-api
            runtime: node
            plan: starter
            region: singapore
            buildCommand: npm ci --include=dev && npm run db:generate && npm run build -w @ntrack/api
            # Database and ClickHouse migrations, then the Nextagmedia organization and first admin
            # (idempotent: existing records are left alone).
            preDeployCommand: npm run db:deploy && npm run analytics:migrate && node apps/api/dist/seed.js
            startCommand: node apps/api/dist/server.js
            healthCheckPath: /health
            envVars:
              - fromGroup: ntrack-secrets
              - fromGroup: ntrack-common
              - key: API_PORT
                value: "10000"
              - key: COOKIE_SECURE
                value: "true"
              - key: COOKIE_PATH
                value: /ntrack
              - key: DATABASE_URL
                fromDatabase:
                  name: ntrack-db
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: ntrack-redis
                  property: connectionString
              - key: CLICKHOUSE_URL
                fromService:
                  type: pserv
                  name: ntrack-clickhouse
                  property: hostport
              - key: CLICKHOUSE_PASSWORD
                fromService:
                  type: pserv
                  name: ntrack-clickhouse
                  envVarKey: CLICKHOUSE_PASSWORD
              # Shown in the console's DNS instructions for customer domains. nextagmedia.com is
              # verified through its forwarded https://nextagmedia.com/.well-known/ntrack instead.
              - key: TRACKER_CNAME_TARGET
                value: ntrack-tracker.onrender.com
              # Exports live on local disk until object storage is added; they expire after 7 days.
              - key: DATA_EXPORT_DIR
                value: /tmp/ntrack-exports
              # First platform admin (asked for when the Blueprint is created).
              - key: SEED_ADMIN_EMAIL
                sync: false
              - key: SEED_ADMIN_NAME
                sync: false
              - key: SEED_ADMIN_PASSWORD
                sync: false

          - type: web
            name: ntrack-tracker
            runtime: node
            plan: starter
            region: singapore
            buildCommand: npm ci --include=dev && npm run db:generate && npm run build -w @ntrack/tracker
            startCommand: node apps/tracker/dist/server.js
            healthCheckPath: /health
            envVars:
              - fromGroup: ntrack-secrets
              - fromGroup: ntrack-common
              - key: TRACKER_PORT
                value: "10000"
              # Visitor IP/country come only from the website's forwarded headers, checked with
              # TRACKER_PROXY_SECRET. Never trust cf-* headers here: anyone can send them.
              - key: TRUST_PROXY
                value: "false"
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: ntrack-redis
                  property: connectionString

          - type: worker
            name: ntrack-workers
            runtime: node
            plan: starter
            region: singapore
            buildCommand: npm ci --include=dev && npm run db:generate && npm run build -w @ntrack/workers
            startCommand: node apps/workers/dist/index.js
            envVars:
              - fromGroup: ntrack-secrets
              - fromGroup: ntrack-common
              - key: DATABASE_URL
                fromDatabase:
                  name: ntrack-db
                  property: connectionString
              - key: REDIS_URL
                fromService:
                  type: keyvalue
                  name: ntrack-redis
                  property: connectionString
              - key: CLICKHOUSE_URL
                fromService:
                  type: pserv
                  name: ntrack-clickhouse
                  property: hostport
              - key: CLICKHOUSE_PASSWORD
                fromService:
                  type: pserv
                  name: ntrack-clickhouse
                  envVarKey: CLICKHOUSE_PASSWORD
