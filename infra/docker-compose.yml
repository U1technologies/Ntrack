# Local infrastructure for NTrack. Start with:
#   docker compose -f infra/docker-compose.yml up -d
# Then run migrations, seed and the three services (see README).
name: ntrack

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ntrack
      POSTGRES_PASSWORD: ntrack_local
      POSTGRES_DB: ntrack_app
    ports: ['5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ntrack -d ntrack_app']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # AOF persistence so the click stream survives a Redis restart before workers drain it.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_DB: ntrack
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ['8123:8123']
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes: ['clickhouse-data:/var/lib/clickhouse']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8123/ping']
      interval: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  clickhouse-data:
